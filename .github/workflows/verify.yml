name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check every episode's published numbers
        run: |
          set -e
          found=0
          for v in episodes/*/verify.py; do
            [ -f "$v" ] || continue
            found=1
            echo "== $v"
            python "$v" --verbose | tail -20
          done
          if [ "$found" = "0" ]; then echo "no verify.py found"; exit 1; fi
