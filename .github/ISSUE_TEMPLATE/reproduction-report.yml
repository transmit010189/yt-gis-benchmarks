name: Reproduction report
description: Tell us what happened when you (or your agent) re-ran an episode.
title: "[repro] EP__ - pass / drift / fail"
labels:
  - reproduction
body:
  - type: markdown
    attributes:
      value: |
        Thanks for re-running. Please paste real output - a claim without numbers cannot be checked.
        If an AI agent did the run, say so and include the commands it used.
  - type: input
    id: episode
    attributes:
      label: Episode folder
      placeholder: episodes/ep26-building-audit
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Which path did you run
      options:
        - cheap path (python verify.py only)
        - full path (scripts and datasets, then verify.py)
        - both
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Output of verify.py
      description: Paste the last lines verbatim, including PASS or FAIL.
      render: shell
    validations:
      required: true
  - type: textarea
    id: drift
    attributes:
      label: Any metric that moved more than one percentage point
      description: Give the layer version or release tag and the old and new value.
      placeholder: "Overture 2026-11-01.0 one2one_coverage_pct 29.58 -> 27.4"
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11 / Python 3.12 / geopandas 1.0.1, or agent Hermes on macOS
  - type: checkboxes
    id: licence
    attributes:
      label: Licence obligations
      options:
        - label: I did not redistribute NLSC raw geometry and kept attribution in any figure I publish.
          required: true
